name: Verify Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:dist
      - run: pnpm verify:browser
      - name: Upload Gameplay playback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-playback-${{ github.sha }}
          path: |
            artifacts/gameplay-*.png
            artifacts/gameplay-playback.json
          if-no-files-found: warn
          retention-days: 14
