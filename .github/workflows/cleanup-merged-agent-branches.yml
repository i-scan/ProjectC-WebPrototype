name: Cleanup merged agent branches

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-merged-agent-branches
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged agent branches without open pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            })

            for (const branch of branches) {
              const name = branch.name
              if (!name.startsWith('agent/')) continue

              const openPulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                head: `${owner}:${name}`,
                per_page: 100,
              })
              if (openPulls.length > 0) {
                core.info(`Keep ${name}: an open pull request still uses it.`)
                continue
              }

              const closedPulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'closed',
                head: `${owner}:${name}`,
                base: 'main',
                per_page: 100,
              })
              if (!closedPulls.some((pull) => Boolean(pull.merged_at))) {
                core.info(`Keep ${name}: no merged pull request targets main.`)
                continue
              }

              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` })
                core.info(`Deleted merged branch ${name}.`)
              } catch (error) {
                if (error.status === 422 || error.status === 404) {
                  core.warning(`Could not delete ${name}: ${error.message}`)
                  continue
                }
                throw error
              }
            }
