name: Apply Hex6 Visual Cards Fix

on:
  push:
    branches:
      - agent/bootstrap-web-prototype

permissions:
  contents: write

concurrency:
  group: apply-hex6-visual-cards-fix
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-web-prototype
      - name: Detect repair trigger
        id: trigger
        run: |
          if test -f src/hex/.visual-cards-fix-trigger; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply source repair
        if: steps.trigger.outputs.run == 'true'
        run: python scripts/apply_hex_hover_rain_cards_fix.py
      - uses: actions/setup-node@v4
        if: steps.trigger.outputs.run == 'true'
        with:
          node-version: 22
      - if: steps.trigger.outputs.run == 'true'
        run: npm install
      - if: steps.trigger.outputs.run == 'true'
        run: npm run test
      - if: steps.trigger.outputs.run == 'true'
        run: npm run build
      - name: Commit validated repair
        if: steps.trigger.outputs.run == 'true'
        run: |
          rm src/hex/.visual-cards-fix-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hex/HexThreeBoard.tsx src/hex/hexRules.ts src/hex/.visual-cards-fix-trigger
          git commit -m "Fix Hex6 hover clouds rain and card draws"
          git push origin HEAD:agent/bootstrap-web-prototype
