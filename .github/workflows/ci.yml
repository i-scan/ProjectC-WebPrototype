name: Prototype CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-web-prototype
      - name: Apply Hex6 topology repair for validation
        if: ${{ hashFiles('src/hex/.topology-repair-trigger') != '' }}
        run: python scripts/repair_hex_topology.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test
      - run: npm run build
      - name: Export validated Hex6 sources
        if: ${{ hashFiles('src/hex/.topology-repair-trigger') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: validated-hex6-topology
          path: |
            src/hex/hexRules.ts
            src/hex/HexThreeBoard.tsx
