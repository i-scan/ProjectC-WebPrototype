name: Prototype CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-web-prototype
          fetch-depth: 0
      - name: Apply pending Hex6 mountain patch
        if: hashFiles('.github/hex-mountains-trigger.txt') != ''
        run: node scripts/apply-hex-mountains.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run test
      - run: npm run build
      - name: Commit verified Hex6 mountain patch
        if: github.event_name == 'push' && hashFiles('.github/hex-mountains-trigger.txt') != ''
        run: |
          rm -f package-lock.json tsconfig.app.tsbuildinfo tsconfig.node.tsbuildinfo
          rm .github/hex-mountains-trigger.txt
          rm scripts/apply-hex-mountains.mjs
          rm .github/workflows/apply-hex-mountains.yml
          cat > .github/workflows/ci.yml <<'YAML'
          name: Prototype CI

          on:
            push:
              branches: [main, "agent/**"]
            pull_request:

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: npm install
                - run: npm run test
                - run: npm run build
          YAML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hex/hexRules.ts src/hex/hexTravel.ts src/hex/HexThreeBoard.tsx src/hex/HexPrototype.tsx .github/workflows/ci.yml .github/hex-mountains-trigger.txt scripts/apply-hex-mountains.mjs .github/workflows/apply-hex-mountains.yml
          git commit -m "Add mountain collision terrain to Hex6 maps"
          git push origin HEAD:agent/bootstrap-web-prototype
