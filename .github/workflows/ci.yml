name: Prototype CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-web-prototype
      - name: Apply one-time Hex6 repair
        if: ${{ hashFiles('src/hex/.hex6-patch-trigger') != '' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def require_replace(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'Missing expected text: {label}')
              return text.replace(old, new, 1)

          def require_regex(text: str, pattern: str, replacement: str, label: str) -> str:
              result, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected one match for {label}, got {count}')
              return result

          main_path = Path('src/main.tsx')
          main = main_path.read_text()
          main = main.replace('四边格视觉切片', 'Square4')
          main = main.replace('六边格验证', 'Hex6')
          main_path.write_text(main)

          prototype_path = Path('src/hex/HexPrototype.tsx')
          prototype = prototype_path.read_text()
          prototype = prototype.replace('ProjectC · Three.js Hex Validation', 'ProjectC · Hex6 · Three.js')
          prototype = prototype.replace('<h1>六边格双层环境棋盘</h1>', '<h1>Hex6 双层环境棋盘</h1>')
          prototype_path.write_text(prototype)

          board_path = Path('src/hex/HexThreeBoard.tsx')
          board = board_path.read_text()

          anchor = "const sameCoord = (a?: Coord, b?: Coord) => Boolean(a && b && a.x === b.x && a.y === b.y)\n"
          helper = anchor + "\nfunction pointInsideHex(x: number, z: number, radius = HEX_RADIUS) {\n  const absX = Math.abs(x)\n  const absZ = Math.abs(z)\n  const rootThree = Math.sqrt(3)\n  return absZ <= radius && absX <= rootThree * radius * 0.5 && rootThree * absZ + absX <= rootThree * radius\n}\n"
          if 'function pointInsideHex' not in board:
              board = require_replace(board, anchor, helper, 'pointInsideHex helper')

          board = board.replace('  mesh.rotation.y = Math.PI / 6\n', '')
          board = board.replace('  ring.rotation.z = Math.PI / 6\n', '')
          board = board.replace('      tile.rotation.y = Math.PI / 6\n', '')

          picker = '''    const raycaster = new THREE.Raycaster()
    const pointer = new THREE.Vector2()
    const boardPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.08)
    const boardPoint = new THREE.Vector3()
    let publishedHover: Coord | undefined

    const publishHover = (coord?: Coord) => {
      if ((!publishedHover && !coord) || sameCoord(publishedHover, coord)) return
      publishedHover = coord ? { ...coord } : undefined
      onHoverRef.current?.(coord)
    }

    const coordFromPointer = (eventValue: PointerEvent) => {
      const rect = renderer.domElement.getBoundingClientRect()
      pointer.x = ((eventValue.clientX - rect.left) / rect.width) * 2 - 1
      pointer.y = -((eventValue.clientY - rect.top) / rect.height) * 2 + 1
      raycaster.setFromCamera(pointer, camera)
      if (!raycaster.ray.intersectPlane(boardPlane, boardPoint)) return undefined

      const currentState = stateRef.current
      let nearest: Coord | undefined
      let nearestDistance = Number.POSITIVE_INFINITY
      for (const cell of currentState.cells) {
        const center = hexWorldPosition(cell.coord, currentState)
        const dx = boardPoint.x - center.x
        const dz = boardPoint.z - center.z
        const distanceSquared = dx * dx + dz * dz
        if (distanceSquared < nearestDistance) {
          nearest = cell.coord
          nearestDistance = distanceSquared
        }
      }
      if (!nearest) return undefined

      const center = hexWorldPosition(nearest, currentState)
      return pointInsideHex(boardPoint.x - center.x, boardPoint.z - center.z, HEX_RADIUS * 1.025)
        ? nearest
        : undefined
    }

    const drag'''
          board = require_regex(
              board,
              r"    const raycaster = new THREE\.Raycaster\(\).*?\n    const drag",
              lambda _: picker,
              'analytic pointer picker',
          )

          board = board.replace('        onHoverRef.current?.(undefined)\n', '        publishHover(undefined)\n')
          board = board.replace('      onHoverRef.current?.(coord)\n', '      publishHover(coord)\n')

          wheel = '''    const handleWheel = (eventValue: WheelEvent) => {
      eventValue.preventDefault()
      orbitRef.current.zoom = clamp(orbitRef.current.zoom * Math.exp(-eventValue.deltaY * 0.001), 0.58, 2.15)
      updateCamera()
    }
'''
          if 'const handleLeave' not in board:
              board = require_replace(
                  board,
                  wheel,
                  wheel + "    const handleLeave = () => {\n      if (!drag.active) publishHover(undefined)\n    }\n",
                  'pointer leave handler',
              )
          board = board.replace(
              "    renderer.domElement.addEventListener('pointerleave', () => onHoverRef.current?.(undefined))\n",
              "    renderer.domElement.addEventListener('pointerleave', handleLeave)\n",
          )
          if "removeEventListener('pointerleave', handleLeave)" not in board:
              board = require_replace(
                  board,
                  "      renderer.domElement.removeEventListener('pointercancel', handleUp)\n      renderer.domElement.removeEventListener('wheel', handleWheel)\n",
                  "      renderer.domElement.removeEventListener('pointercancel', handleUp)\n      renderer.domElement.removeEventListener('pointerleave', handleLeave)\n      renderer.domElement.removeEventListener('wheel', handleWheel)\n",
                  'pointer leave cleanup',
              )

          outline = '''      const outlinePoints = Array.from({ length: 6 }, (_, index) => {
        const angle = Math.PI * 0.5 - index * Math.PI / 3
        return new THREE.Vector3(Math.cos(angle) * HEX_RADIUS, 0.096, Math.sin(angle) * HEX_RADIUS)
      })
      const edges = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(outlinePoints),
        new THREE.LineBasicMaterial({
          color: temperatureColors[clamp(cell.groundTemp, -3, 3) + 3],
          transparent: true,
          opacity: 0.42,
          depthWrite: false,
        }),
      )
      edges.renderOrder = 5
      tile.add(edges)'''
          board = require_regex(
              board,
              r"      const edges = new THREE\.LineSegments\(.*?      tile\.add\(edges\)",
              lambda _: outline,
              'top-only outline',
          )

          if 'tile.rotation.y = Math.PI / 6' in board or 'mesh.rotation.y = Math.PI / 6' in board:
              raise SystemExit('Mismatched Hex6 rotation remains')
          for marker in ['function pointInsideHex', 'const boardPlane = new THREE.Plane', 'const edges = new THREE.LineLoop']:
              if marker not in board:
                  raise SystemExit(f'Patch verification failed: {marker}')
          board_path.write_text(board)

          Path('src/hex/.hex6-patch-trigger').unlink(missing_ok=True)
          Path('.github/workflows/patch-hex6-grid.yml').unlink(missing_ok=True)
          Path('.github/workflows/ci.yml').write_text('''name: Prototype CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test
      - run: npm run build
''')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx src/hex/HexPrototype.tsx src/hex/HexThreeBoard.tsx src/hex/.hex6-patch-trigger .github/workflows/patch-hex6-grid.yml .github/workflows/ci.yml
          git commit -m "Fix Hex6 tiling and stable cell picking"
          git push origin HEAD:agent/bootstrap-web-prototype
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test
      - run: npm run build
