name: Export Hex6 Topology Repair

on:
  push:
    branches:
      - agent/bootstrap-web-prototype

jobs:
  export:
    if: ${{ hashFiles('src/hex/.topology-repair-trigger') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-web-prototype
      - name: Apply repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'Missing expected text for {label}')
              return text.replace(old, new, 1)

          def regex_once(text: str, pattern: str, replacement: str, label: str) -> str:
              result, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected one match for {label}, got {count}')
              return result

          rules_path = Path('src/hex/hexRules.ts')
          rules = rules_path.read_text()
          topology_import = """import {
            getHexNeighbors,
            hexAdvance,
            hexDirectionOnLine,
            hexDistance,
            isHexStraightLine,
            type HexDirection,
          } from './hexTopology'

          export {
            HEX_DIRECTIONS,
            axialToOffset,
            getHexNeighbors,
            hexAdvance,
            hexDirectionBetween,
            hexDirectionOnLine,
            hexDirectionWorldVector,
            hexDirectionYaw,
            hexDistance,
            hexLine,
            hexRay,
            hexWorldOffset,
            isHexStraightLine,
            offsetToAxial,
          } from './hexTopology'
          export type { HexDirection } from './hexTopology'

          const clone = <T>(value: T): T => structuredClone(value)
          const sameCoord = (a: Coord, b: Coord) => a.x === b.x && a.y === b.y
          const clamp = (value: number, min: number, max: number) => Math.max(min, Math.min(max, value))
          const keyOf = (coord: Coord) => `${coord.x},${coord.y}`
          """
          topology_import = re.sub(r'^          ', '', topology_import, flags=re.M)
          rules = replace_once(rules, "} from '../game'\n\n", "} from '../game'\n\n" + topology_import + "\n", 'topology import')
          rules = regex_once(
              rules,
              r"export type HexDirection = 'E'[\s\S]*?export function isHexStraightLine\(a: Coord, b: Coord\): boolean \{[\s\S]*?\n\}\n\n",
              '',
              'legacy topology definitions',
          )
          rules = rules.replace('hexDirectionDelta(', 'hexAdvance(')
          rules = regex_once(
              rules,
              r"export function hexStepToward\(state: GameState, from: Coord, to: Coord, movingActorId: string\): Coord \{[\s\S]*?\n\}\n\nexport function buildHexPath",
              """export function hexStepToward(state: GameState, from: Coord, to: Coord, movingActorId: string): Coord {
            const currentDistance = hexDistance(from, to)
            return getHexNeighbors(from)
              .map((entry, order) => ({
                ...entry,
                order,
                distance: hexDistance(entry.coord, to),
              }))
              .filter((entry) =>
                entry.distance < currentDistance &&
                isHexInside(state, entry.coord) &&
                !isBlocked(state, entry.coord, movingActorId),
              )
              .sort((a, b) => a.distance - b.distance || a.order - b.order)[0]?.coord ?? from
          }

          export function buildHexPath""".replace('          ', ''),
              'hex step toward',
          )
          rules = regex_once(
              rules,
              r"function pushActor\(state: GameState, actor: Actor, awayFrom: Coord\): void \{[\s\S]*?\n\}\n\nfunction removeCardFromHand",
              """export function hexPushDestination(
            state: GameState,
            actorPosition: Coord,
            awayFrom: Coord,
            movingActorId = '',
          ): Coord | null {
            if (hexDistance(awayFrom, actorPosition) !== 1) return null
            const direction = hexDirectionOnLine(awayFrom, actorPosition)
            if (!direction) return null
            const destination = hexAdvance(actorPosition, direction)
            if (!isHexInside(state, destination) || isBlocked(state, destination, movingActorId)) return null
            return destination
          }

          function pushActor(state: GameState, actor: Actor, awayFrom: Coord): void {
            if (actor.mass === 'heavy') {
              addLog(state, `${actor.name} 质量为 Heavy，普通推斩无法击退。`)
              return
            }
            const destination = hexPushDestination(state, actor.position, awayFrom, actor.id)
            if (!destination) {
              addLog(state, `${actor.name} 的直线击退被阻挡。`)
              return
            }
            const direction = hexDirectionOnLine(awayFrom, actor.position)
            actor.position = destination
            addLog(state, `${actor.name} 沿 ${direction} 方向被击退到 (${destination.x},${destination.y})。`)
          }

          function removeCardFromHand""".replace('          ', ''),
              'directional push',
          )
          rules_path.write_text(rules)

          board_path = Path('src/hex/HexThreeBoard.tsx')
          board = board_path.read_text()
          board = replace_once(
              board,
              "import { buildHexPath, getHexWind, hexDistance, type HexDirection } from './hexRules'",
              "import { buildHexPath, getHexWind, hexDistance, type HexDirection } from './hexRules'\nimport { hexDirectionYaw, hexWorldOffset } from './hexTopology'",
              'board topology import',
          )
          board = regex_once(
              board,
              r"function rawHexPosition\(coord: Coord\) \{[\s\S]*?\n\}\n",
              """function rawHexPosition(coord: Coord) {
            return hexWorldOffset(coord, HEX_RADIUS)
          }
          """.replace('          ', ''),
              'world position',
          )
          board = regex_once(
              board,
              r"  const rotations: Record<HexDirection, number> = \{[\s\S]*?  group\.rotation\.y = rotations\[direction\]",
              "  group.rotation.y = hexDirectionYaw(direction)",
              'wind yaw',
          )
          board_path.write_text(board)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: validated-hex6-topology
          path: |
            src/hex/hexRules.ts
            src/hex/HexThreeBoard.tsx
