name: Report Pages deployment status

on:
  workflow_run:
    workflows:
      - Deploy GitHub Pages
    types:
      - completed

permissions:
  contents: read
  statuses: write

jobs:
  report:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified Pages status on the source commit
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run
            const conclusion = run.conclusion ?? 'unknown'
            const state = conclusion === 'success'
              ? 'success'
              : conclusion === 'failure' || conclusion === 'timed_out' || conclusion === 'action_required'
                ? 'failure'
                : 'error'
            const description = state === 'success'
              ? 'Pages build, deploy, and published-commit verification passed'
              : `Pages workflow completed with ${conclusion}`

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: run.head_sha,
              state,
              context: 'pages/verified-deployment',
              description: description.slice(0, 140),
              target_url: run.html_url,
            })
