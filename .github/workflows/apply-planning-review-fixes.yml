name: Apply planning review documentation fixes

on:
  push:
    branches:
      - agent/fix-runtime-authority-terminology

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-runtime-authority-terminology
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-planning-review-fixes.py
      - name: Commit documentation fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md AGENTS.md config/README.md
          git diff --cached --quiet && exit 0
          git commit -m "Address planning review documentation feedback"
          git push
