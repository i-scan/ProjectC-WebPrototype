name: Temporary UT7 navigation integrator

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'feat/ut7-multi-at-navigation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ut7-multi-at-navigation
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply navigation UI patch
        run: |
          sed -i "s/。' ''',/。''',/g" .github/patch-ut7-multi-at-navigation.py
          python .github/patch-ut7-multi-at-navigation.py

      - name: Verify branch
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Commit UI integration to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/hex/ActorLoopUt7BasicMovePlayground.tsx
          git commit -m 'Enable remote multi-AT Basic Move navigation'
          git push origin HEAD:feat/ut7-multi-at-navigation
