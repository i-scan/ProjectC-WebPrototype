name: Apply runtime authority documentation fix

on:
  push:
    branches:
      - agent/fix-runtime-authority-terminology

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-runtime-authority-terminology
      - name: Apply documentation patch
        run: python scripts/apply-runtime-authority-doc-fix.py
      - name: Commit patched documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Fix current runtime authority terminology"
          git push
