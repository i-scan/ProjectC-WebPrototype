name: Apply Trajectory preview corridor patch

on:
  push:
    branches:
      - fix/trajectory-preview-corridor-curve
    paths:
      - .github/workflows/apply-trajectory-preview-corridor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trajectory-preview-corridor-curve
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-trajectory-preview-corridor.py
      - name: Install dependencies
        run: pnpm install
      - name: Verify
        run: |
          pnpm test
          pnpm build
          pnpm verify:dist
          pnpm verify:browser
      - name: Commit implementation only
        run: |
          rm scripts/patch-trajectory-preview-corridor.py
          rm .github/workflows/apply-trajectory-preview-corridor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts .github/workflows/apply-trajectory-preview-corridor.yml
          git commit -m "Relax Trajectory preview within visited Cell corridor"
          git push origin HEAD:fix/trajectory-preview-corridor-curve
