name: Apply target body inertia HUD patch

on:
  push:
    branches:
      - fix/target-body-inertia-hud

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/target-body-inertia-hud
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply integrated Target M / Axis HUD
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          board_path = Path('src/ui/Board3D.jsx')
          board = board_path.read_text()

          old_dummy_tail = """  group.add(base, body, head)\n  group.traverse((child) => { if (child instanceof THREE.Mesh) child.castShadow = true })\n  return group\n}\n\nfunction updateMomentumDots(actor, level) {\n"""
          new_dummy_tail = """  group.add(base, body, head)\n\n  const momentumDots = []\n  for (let index = 0; index < 3; index += 1) {\n    const dot = new THREE.Mesh(\n      new THREE.SphereGeometry(0.052, 12, 8),\n      new THREE.MeshBasicMaterial({ color: 0x334151, transparent: true, opacity: 0.52, depthTest: false }),\n    )\n    dot.position.set((index - 1) * 0.14, 0.96, 0)\n    dot.renderOrder = 50\n    group.add(dot)\n    momentumDots.push(dot)\n  }\n  group.userData.momentumDots = momentumDots\n  group.traverse((child) => { if (child instanceof THREE.Mesh) child.castShadow = true })\n  return group\n}\n\nfunction updateMomentumDots(actor, level) {\n"""
          if old_dummy_tail not in board:
              raise SystemExit('createDummyActor tail not found')
          board = board.replace(old_dummy_tail, new_dummy_tail, 1)

          old_defs_tail = """  defs.appendChild(marker)\n  svg.appendChild(defs)\n\n  const makeAxisLine = (kind) => {\n"""
          new_defs_tail = """  defs.appendChild(marker)\n  svg.appendChild(defs)\n\n  const targetLayer = svgElement('g', { 'data-axis-hud-kind': 'targets' })\n  svg.appendChild(targetLayer)\n  const targetEntries = new Map()\n\n  const makeAxisLine = (kind) => {\n"""
          if old_defs_tail not in board:
              raise SystemExit('axis HUD defs tail not found')
          board = board.replace(old_defs_tail, new_defs_tail, 1)

          old_axis_return = """  const horizontal = makeAxisLine('horizontal')\n  const down = makeAxisLine('down')\n  return {\n    svg,\n    horizontal: horizontal.group,\n    horizontalLine: horizontal.line,\n    down: down.group,\n    downLine: down.line,\n  }\n}\n"""
          new_axis_return = """  const ensureTarget = (actorId) => {\n    const existing = targetEntries.get(actorId)\n    if (existing) return existing\n    const group = svgElement('g', {\n      'data-target-axis-actor-id': actorId,\n      'data-target-m': '0',\n      'data-target-axis': 'none',\n      'data-target-momentum-dots': '3',\n      'data-target-momentum-active': '0',\n    })\n    const line = svgElement('line', {\n      stroke: '#f2c85a', 'stroke-width': AXIS_HUD_STROKE_PX, 'stroke-linecap': 'round',\n      'marker-end': 'url(#projectc-actor-axis-arrow-head)',\n    })\n    line.style.filter = 'drop-shadow(0 0 3px rgba(242,200,90,.66))'\n    group.appendChild(line)\n    targetLayer.appendChild(group)\n    group.style.display = 'none'\n    const entry = { group, line }\n    targetEntries.set(actorId, entry)\n    return entry\n  }\n\n  const pruneTargets = (activeIds) => {\n    for (const [actorId, entry] of targetEntries) {\n      if (activeIds.has(actorId)) continue\n      entry.group.remove()\n      targetEntries.delete(actorId)\n    }\n  }\n\n  const horizontal = makeAxisLine('horizontal')\n  const down = makeAxisLine('down')\n  return {\n    svg,\n    horizontal: horizontal.group,\n    horizontalLine: horizontal.line,\n    down: down.group,\n    downLine: down.line,\n    ensureTarget,\n    pruneTargets,\n  }\n}\n"""
          if old_axis_return not in board:
              raise SystemExit('axis HUD return block not found')
          board = board.replace(old_axis_return, new_axis_return, 1)

          old_sample_boundary = """  setScreenArrow(hud.horizontalLine, source, target.x - source.x, target.y - source.y)\n  return directionId\n}\n\nfunction sampleRecord(samples, progress) {\n"""
          new_sample_boundary = """  setScreenArrow(hud.horizontalLine, source, target.x - source.x, target.y - source.y)\n  return directionId\n}\n\nfunction updateTargetAxisHud(hud, camera, width, height, actorId, position, visualY, axisId, level) {\n  if (!hud || !camera || width < 1 || height < 1) return 'none'\n  const entry = hud.ensureTarget(actorId)\n  const normalizedLevel = Math.max(0, Math.round(Number(level) || 0))\n  entry.group.dataset.targetM = String(normalizedLevel)\n  entry.group.dataset.targetAxis = axisId || 'none'\n  entry.group.dataset.targetMomentumActive = String(Math.min(3, normalizedLevel))\n\n  if (!axisId) {\n    entry.group.style.display = 'none'\n    return 'none'\n  }\n\n  entry.group.style.display = ''\n  const sourceWorld = new THREE.Vector3(position.x, visualY + 0.34, position.z)\n  const source = projectedPoint(sourceWorld, camera, width, height)\n  const direction = directionVector(axisId)\n  const targetWorld = sourceWorld.clone().add(new THREE.Vector3(direction.x, 0, direction.z))\n  const target = projectedPoint(targetWorld, camera, width, height)\n  setScreenArrow(entry.line, source, target.x - source.x, target.y - source.y)\n  return axisId\n}\n\nfunction sampleRecord(samples, progress) {\n"""
          if old_sample_boundary not in board:
              raise SystemExit('updateActorAxisHud boundary not found')
          board = board.replace(old_sample_boundary, new_sample_boundary, 1)

          old_dataset = """    host.dataset.actorAxisPersistent = 'true'\n    host.dataset.axisLengthPx = String(AXIS_HUD_LENGTH_PX)\n"""
          new_dataset = """    host.dataset.actorAxisPersistent = 'true'\n    host.dataset.targetBodyInertiaHud = 'actor-body-m-axis-v1'\n    host.dataset.targetMomentumStyle = 'actor-momentum-dots-v1'\n    host.dataset.targetAxisStyle = 'actor-body-screen-arrow-v5'\n    host.dataset.axisLengthPx = String(AXIS_HUD_LENGTH_PX)\n"""
          if old_dataset not in board:
              raise SystemExit('host dataset insertion point not found')
          board = board.replace(old_dataset, new_dataset, 1)

          old_actor_loop = """      for (const actor of actorsRef.current) {\n        const object = dummyObjectsRef.current.get(actor.id)\n        if (!object) continue\n        let position = axialToWorld(actor.hex)\n        let y = 0.1\n        if (activePlayback) {\n          const points = playbackCacheRef.current.actorPoints.get(actor.id)\n          if (points?.length > 1) {\n            const window = activePlayback.actorPlaybackWindows?.[actor.id]\n            const actorProgress = window\n              ? clamp((progress - window.start) / Math.max(0.02, window.end - window.start), 0, 1)\n              : progress\n            const animated = samplePoint(points, actorProgress)\n            if (animated) position = { x: animated.x, z: animated.z }\n            if (actorProgress > 0 && actorProgress < 1) y += Math.sin(actorProgress * Math.PI) * 0.34\n          }\n        }\n        object.position.set(position.x, y, position.z)\n      }\n\n      renderer.render(scene, camera)\n"""
          new_actor_loop = """      const finalActorById = new Map((activePlayback?.finalState?.actors ?? []).map((actor) => [actor.id, actor]))\n      const targetHudIds = new Set()\n      for (const actor of actorsRef.current) {\n        const object = dummyObjectsRef.current.get(actor.id)\n        if (!object) continue\n        let position = axialToWorld(actor.hex)\n        let y = 0.1\n        let actorProgress = 0\n        if (activePlayback) {\n          const points = playbackCacheRef.current.actorPoints.get(actor.id)\n          if (points?.length > 1) {\n            const window = activePlayback.actorPlaybackWindows?.[actor.id]\n            actorProgress = window\n              ? clamp((progress - window.start) / Math.max(0.02, window.end - window.start), 0, 1)\n              : progress\n            const animated = samplePoint(points, actorProgress)\n            if (animated) position = { x: animated.x, z: animated.z }\n            if (actorProgress > 0 && actorProgress < 1) y += Math.sin(actorProgress * Math.PI) * 0.34\n          }\n        }\n        object.position.set(position.x, y, position.z)\n\n        const finalActor = finalActorById.get(actor.id)\n        const displayActor = activePlayback && actorProgress > 0.01 && finalActor ? finalActor : actor\n        const displayM = Number.isFinite(displayActor?.momentumLevel)\n          ? Math.max(0, Math.round(displayActor.momentumLevel))\n          : momentumLevel(Math.hypot(displayActor?.velocity?.x ?? 0, displayActor?.velocity?.z ?? 0))\n        const displayAxis = displayActor?.axisId ?? nearestAxisId(displayActor?.velocity)\n        updateMomentumDots(object, displayM)\n        updateTargetAxisHud(axisHudRef.current, camera, viewportWidth, viewportHeight, actor.id, position, y, displayAxis, displayM)\n        targetHudIds.add(actor.id)\n      }\n      axisHudRef.current?.pruneTargets(targetHudIds)\n      host.dataset.targetHudActorCount = String(targetHudIds.size)\n\n      renderer.render(scene, camera)\n"""
          if old_actor_loop not in board:
              raise SystemExit('actor render loop not found')
          board = board.replace(old_actor_loop, new_actor_loop, 1)

          old_dummy_create = """    for (const actor of actors) {\n      const object = createDummyActor()\n      const center = axialToWorld(actor.hex)\n      object.position.set(center.x, 0.1, center.z)\n      group.add(object)\n      dummyObjectsRef.current.set(actor.id, object)\n    }\n"""
          new_dummy_create = """    for (const actor of actors) {\n      const object = createDummyActor()\n      const center = axialToWorld(actor.hex)\n      const level = Number.isFinite(actor?.momentumLevel)\n        ? Math.max(0, Math.round(actor.momentumLevel))\n        : momentumLevel(Math.hypot(actor?.velocity?.x ?? 0, actor?.velocity?.z ?? 0))\n      object.position.set(center.x, 0.1, center.z)\n      updateMomentumDots(object, level)\n      group.add(object)\n      dummyObjectsRef.current.set(actor.id, object)\n    }\n"""
          if old_dummy_create not in board:
              raise SystemExit('dummy creation effect not found')
          board = board.replace(old_dummy_create, new_dummy_create, 1)
          board_path.write_text(board)

          index_path = Path('index.html')
          index = index_path.read_text()
          index = index.replace('    <script type="module" src="/src/debug/target-state-overlay.js"></script>\n', '')
          index_path.write_text(index)

          overlay_path = Path('src/debug/target-state-overlay.js')
          if overlay_path.exists():
              overlay_path.unlink()

          verify = r'''import { spawn, spawnSync } from 'node:child_process'
          import { tmpdir } from 'node:os'
          import { join } from 'node:path'

          const pageUrl = 'http://127.0.0.1:4184/ProjectC-WebPrototype/'
          const debugUrl = 'http://127.0.0.1:9234'
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
          const assert = (condition, message, detail) => { if (!condition) throw new Error(`${message}${detail ? `\n${JSON.stringify(detail, null, 2)}` : ''}`) }
          const which = (command) => { const result = spawnSync('which', [command], { encoding: 'utf8' }); return result.status === 0 ? result.stdout.trim() : '' }

          function chromeExecutable() {
            const candidates = [process.env.CHROME_BIN, which('google-chrome'), which('google-chrome-stable'), which('chromium'), which('chromium-browser')].filter(Boolean)
            assert(candidates.length, 'Chrome / Chromium executable was not found')
            return candidates[0]
          }

          async function waitFor(label, operation, attempts = 260, delay = 40) {
            let lastError
            for (let index = 0; index < attempts; index += 1) {
              try { return await operation() } catch (error) { lastError = error; if (index + 1 < attempts) await sleep(delay) }
            }
            throw new Error(`${label} did not become ready: ${lastError?.message ?? lastError}`)
          }

          class CdpClient {
            constructor(url) { this.id = 1; this.pending = new Map(); this.socket = new WebSocket(url) }
            async open() {
              if (this.socket.readyState !== WebSocket.OPEN) await new Promise((resolve, reject) => {
                this.socket.addEventListener('open', resolve, { once: true })
                this.socket.addEventListener('error', reject, { once: true })
              })
              this.socket.addEventListener('message', (event) => {
                const payload = JSON.parse(String(event.data))
                const pending = this.pending.get(payload.id)
                if (!pending) return
                this.pending.delete(payload.id)
                payload.error ? pending.reject(new Error(payload.error.message)) : pending.resolve(payload.result)
              })
            }
            send(method, params = {}) {
              const id = this.id++
              return new Promise((resolve, reject) => {
                this.pending.set(id, { resolve, reject })
                this.socket.send(JSON.stringify({ id, method, params }))
              })
            }
            close() { this.socket.close() }
          }

          async function evaluate(client, expression) {
            const response = await client.send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true })
            if (response.exceptionDetails) throw new Error(response.exceptionDetails.text || 'Runtime evaluation failed')
            return response.result.value
          }

          const state = (client) => evaluate(client, `(() => {
            const api=window.__PROJECTC_PROTOTYPE__;
            const snapshot=api?.snapshot?.();
            const root=document.querySelector('.cell-world-prototype[data-implementation="spatial-inertia-v1-candidate"]');
            const board=document.querySelector('.cell-world-board[data-target-body-inertia-hud="actor-body-m-axis-v1"]');
            const r=Math.round((snapshot?.position?.z??0)/0.8660254037844386);
            const q=Math.round((snapshot?.position?.x??0)-r*0.5);
            return {
              ready:Boolean(api&&snapshot&&root&&board),
              playing:root?.dataset.playing==='true',
              worldAt:Number(root?.dataset.worldAt??-1),
              q,r,
              targetMomentumStyle:board?.dataset.targetMomentumStyle??'',
              targetAxisStyle:board?.dataset.targetAxisStyle??'',
              targetHudActorCount:Number(board?.dataset.targetHudActorCount??0),
              legacyOverlay:Boolean(document.querySelector('.target-state-overlay')),
              actors:(snapshot?.actors??[]).map(a=>({id:a.id,label:a.label,q:a.hex.q,r:a.hex.r,m:Number.isFinite(a.momentumLevel)?a.momentumLevel:0,axis:a.axisId??null})),
              hud:[...document.querySelectorAll('[data-target-axis-actor-id]')].map(row=>({
                id:row.dataset.targetAxisActorId,
                m:Number(row.dataset.targetM),
                axis:row.dataset.targetAxis,
                dots:Number(row.dataset.targetMomentumDots),
                active:Number(row.dataset.targetMomentumActive),
                visible:row.style.display!=='none',
              })),
            };
          })()`)

          async function idle(client, worldAt, q = null, r = null) {
            return waitFor(`idle ${worldAt}`, async () => {
              const value = await state(client)
              if (!value.ready || value.playing || value.worldAt !== worldAt) throw new Error(JSON.stringify(value))
              if (q !== null && (value.q !== q || value.r !== r)) throw new Error(JSON.stringify(value))
              return value
            })
          }

          async function setKinematics(client, axis, level) {
            assert(await evaluate(client, `window.__PROJECTC_PROTOTYPE__.setKinematics(${JSON.stringify(axis)},${level})`), `setKinematics ${axis} M${level} rejected`)
            await waitFor(`kinematics ${axis} M${level}`, async () => {
              const snapshot = await evaluate(client, `window.__PROJECTC_PROTOTYPE__.snapshot()`)
              if (snapshot.momentum !== level || snapshot.axisId !== (axis === 'none' ? null : axis)) throw new Error(JSON.stringify(snapshot))
              return snapshot
            })
          }

          async function fire(client, q, r, expectedWorldAt, expectedQ, expectedR) {
            assert(await evaluate(client, `window.__PROJECTC_PROTOTYPE__.fireAt(${q},${r})`), `fireAt(${q},${r}) rejected`)
            return idle(client, expectedWorldAt, expectedQ, expectedR)
          }

          async function setCollisionSurfaces(client, enabled) {
            const desired = enabled ? 'ON' : 'OFF'
            assert(await evaluate(client, `(() => { const b=[...document.querySelectorAll('button')].find(e=>e.textContent.trim().startsWith('Collision Surfaces')); if(!b)return false; if(!b.textContent.includes('${desired}'))b.click(); return true; })()`), 'Collision Surfaces control missing')
            await waitFor(`Collision ${desired}`, async () => {
              const label = await evaluate(client, `([...document.querySelectorAll('button')].find(e=>e.textContent.trim().startsWith('Collision Surfaces'))?.textContent??'')`)
              if (!label.includes(desired)) throw new Error(label)
              return label
            })
          }

          function actor(value, id = 'dummy-a') { return value.actors.find((entry) => entry.id === id) }
          function hud(value, id = 'dummy-a') { return value.hud.find((entry) => entry.id === id) }

          async function waitTargetHud(client, expected, id = 'dummy-a') {
            return waitFor(`Target body HUD ${id}`, async () => {
              const value = await state(client)
              const entry = hud(value, id)
              if (!entry || entry.m !== expected.m || entry.axis !== expected.axis || entry.dots !== 3 || entry.active !== Math.min(3, expected.m)) throw new Error(JSON.stringify(value))
              if ((expected.axis !== 'none') !== entry.visible) throw new Error(JSON.stringify(value))
              return value
            })
          }

          let previewProcess, chromeProcess, client
          try {
            previewProcess = spawn('pnpm', ['exec', 'vite', 'preview', '--host', '127.0.0.1', '--port', '4184', '--strictPort'], { stdio: ['ignore', 'pipe', 'pipe'] })
            await waitFor('Vite preview', async () => {
              const response = await fetch(pageUrl)
              if (!response.ok) throw new Error(`HTTP ${response.status}`)
              return true
            })

            chromeProcess = spawn(chromeExecutable(), [
              '--headless=new', '--no-sandbox', '--hide-scrollbars', '--disable-dev-shm-usage',
              '--disable-background-timer-throttling', '--disable-renderer-backgrounding', '--disable-backgrounding-occluded-windows',
              '--enable-unsafe-swiftshader', '--remote-debugging-address=127.0.0.1', '--remote-debugging-port=9234',
              `--user-data-dir=${join(tmpdir(), `projectc-target-body-hud-${process.pid}`)}`, '--window-size=1500,1000', 'about:blank',
            ], { stdio: ['ignore', 'ignore', 'pipe'] })

            await waitFor('Chrome DevTools', async () => {
              const response = await fetch(`${debugUrl}/json/version`)
              if (!response.ok) throw new Error(`HTTP ${response.status}`)
              return response.json()
            })
            const targetResponse = await fetch(`${debugUrl}/json/new?${encodeURIComponent(pageUrl)}`, { method: 'PUT' })
            assert(targetResponse.ok, 'Failed to create Chrome target')
            const target = await targetResponse.json()
            client = new CdpClient(target.webSocketDebuggerUrl)
            await client.open()
            await client.send('Page.enable')
            await client.send('Runtime.enable')
            await client.send('Page.navigate', { url: pageUrl })

            let value = await idle(client, 0)
            assert(value.targetMomentumStyle === 'actor-momentum-dots-v1', 'Target M must use Actor momentum-dot style', value)
            assert(value.targetAxisStyle === 'actor-body-screen-arrow-v5', 'Target Axis must use Actor arrow style', value)
            assert(value.legacyOverlay === false, 'Legacy corner Target inertia panel must be removed', value)
            assert(value.targetHudActorCount === 3 && value.hud.length === 3, 'Every default Target must own a body HUD', value)
            for (const entry of value.hud) assert(entry.m === 0 && entry.axis === 'none' && entry.dots === 3 && entry.active === 0 && !entry.visible, 'Reset targets must show M0 dots with no Axis arrow', entry)

            assert(await evaluate(client, `window.__PROJECTC_PROTOTYPE__.setConflictScenario('wall')`), 'wall scenario rejected')
            await idle(client, 0, -1, 0)
            await setCollisionSurfaces(client, false)
            await setKinematics(client, 'none', 0)
            await fire(client, 0, 0, 1, 0, 0)

            await setKinematics(client, 'E', 1)
            assert(await evaluate(client, `window.__PROJECTC_PROTOTYPE__.fireAt(1,0)`), 'adjacent M1 Strike rejected')
            value = await idle(client, 2, 1, 0)
            assert(actor(value)?.q === 2 && actor(value)?.r === 0 && actor(value)?.m === 0 && actor(value)?.axis === 'E', 'M1 stationary-target result changed unexpectedly', value)
            value = await waitTargetHud(client, { m: 0, axis: 'E' })
            assert(hud(value)?.visible, 'M0 target with retained Axis must still show its Axis arrow', value)

            assert(await evaluate(client, `window.__PROJECTC_PROTOTYPE__.setConflictScenario('wall')`), 'second wall scenario rejected')
            await idle(client, 0, -1, 0)
            await setKinematics(client, 'none', 0)
            await fire(client, 0, 0, 1, 0, 0)
            await setKinematics(client, 'E', 2)
            assert(await evaluate(client, `window.__PROJECTC_PROTOTYPE__.fireAt(2,0)`), 'adjacent-path M2 Strike rejected')
            value = await idle(client, 2, 1, 0)
            assert(actor(value)?.q === 3 && actor(value)?.r === 0 && actor(value)?.m === 1 && actor(value)?.axis === 'E', 'M2 stationary-target result changed unexpectedly', value)
            await waitTargetHud(client, { m: 1, axis: 'E' })

            console.log('Verified Target body inertia HUD in Chrome: Actor-style M dots + Axis arrows are attached to every Target, remain correct after M1/M2 Strike, and the old corner panel is absent.')
          } finally {
            try { client?.close() } catch {}
            try { chromeProcess?.kill('SIGTERM') } catch {}
            try { previewProcess?.kill('SIGTERM') } catch {}
          }
          '''
          # Strip the workflow's YAML indentation from the generated JS.
          verify = '\n'.join(line[10:] if line.startswith('          ') else line for line in verify.splitlines()) + '\n'
          Path('scripts/verify-target-body-inertia-hud.mjs').write_text(verify)
          old_verify = Path('scripts/verify-target-inertia-overlay.mjs')
          if old_verify.exists():
              old_verify.unlink()

          package_path = Path('package.json')
          package = package_path.read_text()
          package = package.replace('node scripts/verify-target-inertia-overlay.mjs', 'node scripts/verify-target-body-inertia-hud.mjs')
          package_path.write_text(package)

          workflow = Path('.github/workflows/patch-target-body-hud.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Install dependencies
        run: pnpm install

      - name: Verify patch
        run: |
          pnpm test
          pnpm build
          pnpm verify:dist
          pnpm verify:browser

      - name: Commit verified HUD changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Show Target inertia directly on actors'
          git push origin HEAD:fix/target-body-inertia-hud
