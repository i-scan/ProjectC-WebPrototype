name: Bootstrap failed card feedback fix

on:
  workflow_run:
    workflows:
      - Deploy GitHub Pages
    types:
      - completed

permissions:
  contents: write

jobs:
  bootstrap:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      contains(github.event.workflow_run.head_commit.message, 'bootstrap failed card feedback fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Create implementation branch
        run: git switch -c agent/fix-failed-card-feedback-code

      - name: Apply failed-card playback guard
        run: python scripts/apply-card-feedback-fix.py

      - name: Commit and push implementation branch
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hex/HexPrototype.tsx src/hex/cardFeedbackStructure.test.mjs
          git commit -m 'fix: suppress feedback for failed card plays'
          git push -u origin agent/fix-failed-card-feedback-code
