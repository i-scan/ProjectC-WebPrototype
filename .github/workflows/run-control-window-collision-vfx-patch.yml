name: Run Control Window collision VFX patch

on:
  push:
    branches:
      - fix/control-window-collision-vfx
    paths:
      - scripts/apply-control-window-collision-vfx.py
      - .github/workflows/run-control-window-collision-vfx-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/control-window-collision-vfx
          token: ${{ github.token }}

      - name: Apply patch
        run: python scripts/apply-control-window-collision-vfx.py

      - name: Install dependencies
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify patch
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          pnpm verify:dist
          pnpm verify:browser

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/Board3D.jsx src/labs/control-window/ControlWindowLabV3.jsx scripts/verify-control-window-lab.mjs
          git commit -m "Add Control Window collision debug VFX"
          git push origin HEAD:fix/control-window-collision-vfx
