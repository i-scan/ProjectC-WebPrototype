name: UT7 segmented playback PR patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply focused source patch
        run: python .github/patch-ut7-playback.py

      - name: Commit patched sources
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/hex/HexThreeBoard.tsx src/hex/HexTravelMap.tsx src/hex/ActorLoopUt7BasicMovePlayground.tsx scripts/verify-ut7-basic-move.mjs
          git commit -m 'Animate UT7 actor along resolved cell path'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
