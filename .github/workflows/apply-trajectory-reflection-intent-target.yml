name: Apply Trajectory reflection intent and target toggles

on:
  push:
    branches:
      - fix/trajectory-reflection-intent-target-toggles

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trajectory-reflection-intent-target-toggles
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply implementation patch
        run: python .github/tmp/apply_trajectory_patch.py
      - name: Install dependencies
        run: pnpm install
      - name: Verify
        run: |
          pnpm test
          pnpm build
          pnpm verify:dist
          pnpm verify:browser
      - name: Commit implementation only
        shell: bash
        run: |
          rm .github/workflows/apply-trajectory-reflection-intent-target.yml
          rm .github/tmp/apply_trajectory_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/labs/trajectory/trajectory-rules.js src/labs/trajectory/trajectory-rules.test.js src/labs/trajectory/TrajectoryLab.jsx src/ui/Board3D.jsx scripts/verify-trajectory-lab.mjs .github/workflows/apply-trajectory-reflection-intent-target.yml .github/tmp/apply_trajectory_patch.py
          git commit -m "Fix Trajectory reflection preview and add target wall toggles"
          git push origin HEAD:fix/trajectory-reflection-intent-target-toggles
