name: Patch Hex Wind Type

on:
  push:
    branches:
      - agent/bootstrap-web-prototype

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-web-prototype
      - name: Apply type compatibility patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/hex/hexRules.ts')
          text = path.read_text()
          old = ";(cell as GameState['cells'][number] & { wind: HexDirection | null }).wind = direction"
          new = ";(cell as unknown as { wind: HexDirection | null }).wind = direction"
          if old not in text:
              raise SystemExit('Expected hex wind assignment was not found')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/patch-hex-wind.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hex/hexRules.ts .github/workflows/patch-hex-wind.yml
          git commit -m "Fix hex wind direction typing"
          git push origin HEAD:agent/bootstrap-web-prototype
