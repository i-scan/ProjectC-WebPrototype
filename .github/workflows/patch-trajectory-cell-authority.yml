name: Patch Trajectory Lab cell authority and direct steer input

on:
  push:
    branches:
      - fix/trajectory-cell-centers-direct-steer
    paths:
      - .github/workflows/patch-trajectory-cell-authority.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trajectory-cell-centers-direct-steer
      - name: Apply focused fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise RuntimeError(f'anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          rules = 'src/labs/trajectory/trajectory-rules.js'
          replace(rules,
          '''  const simulated = simulatePath({ state, actionId, targetHeading, boardRadius, responseCurve, solverSamples })
  const samples = simulated.samples
  const last = samples.at(-1)
  const reachedBoardEdge = samples.length < Math.max(2, Math.round(solverSamples || TRAJECTORY_DEFAULT_SAMPLES) + 1) && simulated.travelDistance > 0
  let endHeading = Number.isFinite(last?.velocity?.x) && Math.hypot(last.velocity.x, last.velocity.z) > 0.001
    ? vectorAngle(last.velocity)
    : simulated.initialHeading
''',
          '''  const simulated = simulatePath({ state, actionId, targetHeading, boardRadius, responseCurve, solverSamples })
  // Process Steering is continuous only inside the Action. The board remains Cell-authoritative:
  // derive the Landing Cell from the continuous trajectory, then settle Ready exactly at that Cell center.
  const samples = simulated.samples.map((sample) => ({
    ...sample,
    position: { ...sample.position },
    velocity: { ...sample.velocity },
  }))
  const rawLast = samples.at(-1)
  const crossings = crossingTrace(samples, boardRadius)
  const finalHex = worldToAxial(rawLast.position)
  const finalPosition = axialToWorld(finalHex)
  const reachedBoardEdge = samples.length < Math.max(2, Math.round(solverSamples || TRAJECTORY_DEFAULT_SAMPLES) + 1) && simulated.travelDistance > 0
  let endHeading = Number.isFinite(rawLast?.velocity?.x) && Math.hypot(rawLast.velocity.x, rawLast.velocity.z) > 0.001
    ? vectorAngle(rawLast.velocity)
    : simulated.initialHeading
''')
          replace(rules,
          '''  const finalState = {
    ...state,
    position: { ...last.position },
    velocity: finalVelocity,
    axisId: actionId === 'coast' && startM === 0 && !state.axisId ? null : finalAxis,
    momentumLevel: finalM,
    heading: endHeading,
    worldAt: Number(state.worldAt ?? 0) + 1,
  }
  const crossings = crossingTrace(samples, boardRadius)
  const finalHex = worldToAxial(finalState.position)
''',
          '''  const finalState = {
    ...state,
    position: { ...finalPosition },
    velocity: finalVelocity,
    axisId: actionId === 'coast' && startM === 0 && !state.axisId ? null : finalAxis,
    momentumLevel: finalM,
    heading: endHeading,
    worldAt: Number(state.worldAt ?? 0) + 1,
  }
  // Playback may interpolate continuously between centers, but its Action endpoint must match Ready authority.
  samples[samples.length - 1] = {
    ...rawLast,
    position: { ...finalPosition },
    velocity: { ...finalVelocity },
    axisId: finalState.axisId,
  }
''')

          tests = 'src/labs/trajectory/trajectory-rules.test.js'
          replace(tests,
                  "import { worldToAxial } from '../../sim/hex.js'",
                  "import { axialToWorld, worldToAxial } from '../../sim/hex.js'")
          replace(tests,
          '''  it('caps Basic Steer at 60 degrees per complete Action, not per Cell', () => {
''',
          '''  it('settles every Action endpoint exactly on the derived Cell center while keeping intermediate motion continuous', () => {
    const state = makeTrajectoryState({ axisId: 'E', momentum: 3 })
    const result = plan(state, 'steer', { q: 0, r: -3 })
    const center = axialToWorld(result.finalHex)
    expect(result.finalState.position.x).toBeCloseTo(center.x, 8)
    expect(result.finalState.position.z).toBeCloseTo(center.z, 8)
    expect(result.samples.at(-1).position.x).toBeCloseTo(center.x, 8)
    expect(result.samples.at(-1).position.z).toBeCloseTo(center.z, 8)

    const hasOffCenterIntermediateSample = result.samples.slice(1, -1).some((sample) => {
      const sampleHex = worldToAxial(sample.position)
      const sampleCenter = axialToWorld(sampleHex)
      return Math.hypot(sample.position.x - sampleCenter.x, sample.position.z - sampleCenter.z) > 0.02
    })
    expect(hasOffCenterIntermediateSample).toBe(true)
  })

  it('caps Basic Steer at 60 degrees per complete Action, not per Cell', () => {
''')

          lab = 'src/labs/trajectory/TrajectoryLab.jsx'
          replace(lab,
                  "const [lastEvent, setLastEvent] = useState('B preset loaded at E / M2. Hover or click any Cell to define Steering direction; Coast remains visible as the neutral projection.')",
                  "const [lastEvent, setLastEvent] = useState('B preset loaded at E / M2. Hover previews direction; with Steer selected, click any Cell to execute immediately. Action ends at a Cell center.')")
          replace(lab,
                  "setLastEvent('B preset loaded at E / M2. Hover or click any Cell to define Steering direction; Coast remains visible as the neutral projection.')",
                  "setLastEvent('B preset loaded at E / M2. Hover previews direction; with Steer selected, click any Cell to execute immediately. Action ends at a Cell center.')")
          replace(lab,
          '''              onClickHex={(hex) => {
                if (playback || !hex || axialKey(hex) === axialKey(currentHex)) return
                setActionId('steer')
                setSelectedHex({ ...hex })
                setHoverHex(null)
              }}
''',
          '''              onClickHex={(hex) => {
                if (playback || actionId !== 'steer' || !hex || axialKey(hex) === axialKey(currentHex)) return
                setSelectedHex({ ...hex })
                setHoverHex(null)
                commitSteer(hex)
              }}
''')
          replace(lab,
                  '''              <div><h2>Ready Actions</h2><p>Ready belongs to Action completion, not M threshold. At M&gt;0 the Actor is still moving while you choose the next control.</p></div>''',
                  '''              <div><h2>Ready Actions</h2><p>Select Move/Steer, then click a Cell to execute immediately. Ready belongs to Action completion; continuous motion is only the 1AT transition between Cell-center states.</p></div>''')
          replace(lab,
          '''            <button
              type="button"
              className="wide-button trajectory-commit"
              data-trajectory-commit
              disabled={Boolean(playback) || actionId !== 'steer' || !selectedHex}
              onClick={() => commitSteer(selectedHex)}
            >
              Commit {actionLabel} · 1 AT {selectedHex ? `· direction Cell ${selectedHex.q},${selectedHex.r}` : '· choose direction'}
            </button>
''',
          '''            <p className="trajectory-direct-input-note" data-direct-input-note>Move / Steer selected → hover previews → click Cell executes. No separate Commit step.</p>
''')
          replace(lab,
                  '''      data-response-curve={responseCurve}
    >''',
                  '''      data-response-curve={responseCurve}
      data-cell-authority="ready-cell-center"
      data-steer-input="direct-cell-click"
    >''')
          replace(lab,
                  '''              <span>Click Cell = direction only, never Destination</span>''',
                  '''              <span>Move / Steer selected → click Cell = execute direction immediately</span>''')

          smoke = 'scripts/verify-trajectory-lab.mjs'
          replace(smoke,
          '''  assert(dom.includes('data-axis-style="actor-body-screen-arrow-v5"'), 'Board3D Axis HUD did not mount')
''',
          '''  assert(dom.includes('data-axis-style="actor-body-screen-arrow-v5"'), 'Board3D Axis HUD did not mount')
  assert(dom.includes('data-cell-authority="ready-cell-center"'), 'Cell-authoritative Ready marker missing')
  assert(dom.includes('data-steer-input="direct-cell-click"'), 'Direct Cell-click Steering marker missing')
  assert(!dom.includes('data-trajectory-commit'), 'Legacy extra Commit step must not be present')
''')

          Path('.github/workflows/patch-trajectory-cell-authority.yml').unlink()
          PY
      - name: Commit focused patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/labs/trajectory scripts/verify-trajectory-lab.mjs .github/workflows/patch-trajectory-cell-authority.yml
          git commit -m "Keep Trajectory Ready states on Cell centers"
          git push origin HEAD:fix/trajectory-cell-centers-direct-steer
