name: Apply failed card feedback fix branch

on:
  push:
    branches:
      - agent/fix-failed-card-feedback-code

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, 'suppress feedback for failed card plays')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-failed-card-feedback-code

      - name: Apply failed-card playback guard
        run: python scripts/apply-card-feedback-fix.py

      - name: Commit implementation
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hex/HexPrototype.tsx src/hex/cardFeedbackStructure.test.mjs
          git commit -m 'fix: suppress feedback for failed card plays'
          git push origin HEAD:agent/fix-failed-card-feedback-code
