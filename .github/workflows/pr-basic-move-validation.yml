name: Basic Move PR Validation

on:
  push:
    branches: [fix/basic-move-adjacent-inertia-path]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_BUILD_COMMIT: ${{ github.sha }}
  VITE_BUILD_BRANCH: ${{ github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Verify dist
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: pnpm verify:dist
      - name: Verify browser
        run: pnpm verify:browser
