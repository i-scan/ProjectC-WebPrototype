name: Apply Control Window swept Cell contact

on:
  push:
    branches:
      - fix/control-window-swept-cell-contact

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply same-AT swept Cell contact'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/control-window-swept-cell-contact
          token: ${{ github.token }}

      - name: Patch Control Window v3 locally
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/labs/control-window/control-window-v3-rules.js')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "export const CONTROL_WINDOW_WANDER_RULE = 'two-actor-wander-contact-v2'\n",
              "export const CONTROL_WINDOW_WANDER_RULE = 'two-actor-wander-contact-v2'\nexport const CONTROL_WINDOW_PATH_CONTACT_RULE = 'same-at-swept-cell-contact-v1'\n",
          )

          replace_once(
              "  const playerSamples = []\n",
              "  const playerSamples = []\n  const playerSweptCells = [{\n    hex: cloneHex(initialPlayerHex),\n    momentum: logicalM,\n    axisId: playerAxis,\n    stepIndex: 0,\n  }]\n",
          )

          replace_once(
              "    onEnterCell: ({ from, to, axisId: entryAxis }) => {\n      const targetActorId = occupancy.get(axialKey(to))\n",
              "    onEnterCell: ({ from, to, axisId: entryAxis }) => {\n      const contactM = logicalM\n      const targetActorId = occupancy.get(axialKey(to))\n",
          )

          replace_once(
              "      if (decayMode === 'action') {\n",
              "      playerSweptCells.push({\n        hex: cloneHex(to),\n        from: cloneHex(from),\n        momentum: contactM,\n        axisId: entryAxis,\n        stepIndex: playerSweptCells.length,\n      })\n\n      if (decayMode === 'action') {\n",
          )

          replace_once(
              "  appendSurfaceEvents('player', primaryMotion, conflictEvents)\n\n  const forcePlayer = (incomingM, incomingAxis) => {\n",
              "  appendSurfaceEvents('player', primaryMotion, conflictEvents)\n\n  const sweptPlayerRecordFor = (hex) => playerSweptCells.find((record) => sameHex(record.hex, hex)) ?? null\n  const rewindPlayerToSweptRecord = (record) => {\n    if (!record) return\n    playerHex = cloneHex(record.hex)\n    logicalM = clampActorM(record.momentum)\n    playerAxis = record.axisId ?? playerAxis\n    const sampleIndex = playerSamples.findIndex((sample) => sameHex(worldToAxial(sample.position), record.hex))\n    if (sampleIndex >= 0) playerSamples.splice(sampleIndex + 1)\n  }\n\n  const forcePlayer = (incomingM, incomingAxis) => {\n",
          )

          replace_once(
              "      if (sameHex(chosen.candidate, playerHex)) {\n        const incomingM = 1\n",
              "      const sweptRecord = !playerConflict && !incomingPlayerConflict\n        ? sweptPlayerRecordFor(chosen.candidate)\n        : null\n      const directPlayerContact = sameHex(chosen.candidate, playerHex)\n      const sweptPlayerContact = Boolean(sweptRecord && !directPlayerContact)\n\n      if (directPlayerContact || sweptPlayerContact) {\n        if (sweptPlayerContact) {\n          rewindPlayerToSweptRecord(sweptRecord)\n          conflictEvents.push({\n            kind: 'swept-cell-contact',\n            sourceActorId: actor.id,\n            targetActorId: 'player',\n            cell: cloneHex(chosen.candidate),\n            playerStepIndex: sweptRecord.stepIndex,\n            playerMAtContact: logicalM,\n            playerAxisAtContact: playerAxis,\n            rule: CONTROL_WINDOW_PATH_CONTACT_RULE,\n          })\n        }\n        const incomingM = 1\n",
          )

          replace_once(
              "          directionId: chosen.direction.id,\n          composition,\n        }\n        conflictEvents.push({\n",
              "          directionId: chosen.direction.id,\n          composition,\n          sweptCellContact: sweptPlayerContact,\n          contactCell: cloneHex(chosen.candidate),\n          pathContactRule: sweptPlayerContact ? CONTROL_WINDOW_PATH_CONTACT_RULE : null,\n        }\n        conflictEvents.push({\n",
          )

          replace_once(
              "          contactBehavior: 'Strike',\n          enemyInitiated: true,\n        })\n\n        actor.axisId = chosen.direction.id\n",
              "          contactBehavior: 'Strike',\n          enemyInitiated: true,\n          sweptCellContact: sweptPlayerContact,\n          pathContactRule: sweptPlayerContact ? CONTROL_WINDOW_PATH_CONTACT_RULE : null,\n        })\n\n        actor.axisId = chosen.direction.id\n",
          )

          replace_once(
              "  if (incomingPlayerConflict) resolvedSummary += ` · ${incomingPlayerConflict.sourceActorId} struck player @ M1`\n",
              "  if (incomingPlayerConflict) resolvedSummary += ` · ${incomingPlayerConflict.sourceActorId} struck player @ M1${incomingPlayerConflict.sweptCellContact ? ' · swept Cell' : ''}`\n",
          )

          replace_once(
              "    collisionRule: CONTROL_WINDOW_COLLISION_RULE,\n    wanderRule: CONTROL_WINDOW_WANDER_RULE,\n",
              "    collisionRule: CONTROL_WINDOW_COLLISION_RULE,\n    pathContactRule: CONTROL_WINDOW_PATH_CONTACT_RULE,\n    wanderRule: CONTROL_WINDOW_WANDER_RULE,\n",
          )

          path.write_text(text)

          test = Path('src/labs/control-window/control-window-swept-contact.test.js')
          test.write_text("""import { describe, expect, it } from 'vitest'\nimport {\n  CONTROL_WINDOW_PATH_CONTACT_RULE,\n  makeControlWindowState,\n  persistentToWindowPlan,\n} from './control-window-v3-rules.js'\n\ndescribe('Control Window same-AT swept Cell Contact', () => {\n  it('collides when enemy Wander enters a Cell the player crossed earlier in the same 1 AT packet', () => {\n    const state = makeControlWindowState({ hex: { q: 0, r: 0 }, momentum: 3, axisId: 'E', worldAt: 0 })\n    const actors = [{\n      id: 'crossing-enemy',\n      label: 'Crossing Enemy',\n      hex: { q: 0, r: 1 },\n      axisId: 'NE',\n      momentumLevel: 0,\n      velocity: { x: 0, z: 0 },\n    }]\n\n    const plan = persistentToWindowPlan({\n      state,\n      threshold: 1,\n      actors,\n      boardRadius: 6,\n      wanderEnabled: true,\n      wanderSeed: 6,\n    })\n\n    expect(plan.pathContactRule).toBe(CONTROL_WINDOW_PATH_CONTACT_RULE)\n    expect(plan.incomingPlayerConflict).toMatchObject({\n      sourceActorId: 'crossing-enemy',\n      targetActorId: 'player',\n      sweptCellContact: true,\n      contactCell: { q: 1, r: 0 },\n      pathContactRule: CONTROL_WINDOW_PATH_CONTACT_RULE,\n    })\n    expect(plan.conflictEvents).toEqual(expect.arrayContaining([expect.objectContaining({\n      kind: 'swept-cell-contact',\n      cell: { q: 1, r: 0 },\n      playerMAtContact: 3,\n      playerAxisAtContact: 'E',\n    })]))\n    expect(plan.actorStates.find((actor) => actor.id === 'crossing-enemy')?.hex).toEqual({ q: 1, r: 0 })\n    expect(plan.traversedCells).toContainEqual({ q: 1, r: 0 })\n    expect(plan.finalState.position).not.toEqual(state.position)\n  })\n})\n""")
          PY

          rm .github/workflows/apply-control-window-swept-contact.yml

      - name: Commit patched rule and regression
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/labs/control-window/control-window-v3-rules.js src/labs/control-window/control-window-swept-contact.test.js .github/workflows/apply-control-window-swept-contact.yml
          git commit -m "Apply same-AT swept Cell contact"
          git push origin HEAD:fix/control-window-swept-cell-contact
