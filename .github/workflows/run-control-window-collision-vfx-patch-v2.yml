name: Retry Control Window collision VFX patch

on:
  push:
    branches:
      - fix/control-window-collision-vfx
    paths:
      - .github/workflows/run-control-window-collision-vfx-patch-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/control-window-collision-vfx
          token: ${{ github.token }}

      - name: Relax two render-loop anchors and apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-control-window-collision-vfx.py')
          text = path.read_text()
          old = '''board = replace_once(
              board,
              "      host.dataset.playbackId = String(activePlayback.id)\\n    } else {\\n      playbackCacheRef.current = { id: null, playerPoints: [], actorPoints: new Map() }",
              "      host.dataset.playbackId = String(activePlayback.id)\\n      updateCollisionDebugFx(collisionFxGroupRef.current, progress)\\n    } else {\\n      if (playbackCacheRef.current.id !== null) clearCollisionDebugFx(collisionFxGroupRef.current)\\n      playbackCacheRef.current = { id: null, playerPoints: [], actorPoints: new Map() }",
              'collision fx render update',
          )
          board = replace_once(
              board,
              "      host.dataset.playbackPathMode = 'smooth'\\n      delete host.dataset.playbackId\\n    }",
              "      host.dataset.playbackPathMode = 'smooth'\\n      host.dataset.collisionFxEventCount = '0'\\n      delete host.dataset.playbackId\\n    }\\n    host.dataset.collisionDebugFx = showDebugCollisionFxRef.current ? 'on' : 'off'\\n    host.dataset.collisionDebugFxStyle = showDebugCollisionFxRef.current ? 'logic-event-pulse-v1' : 'off'",
              'collision fx datasets',
          )
          '''
          new = '''board = replace_once(
              board,
              "host.dataset.playbackId = String(activePlayback.id)",
              "host.dataset.playbackId = String(activePlayback.id)\\n        updateCollisionDebugFx(collisionFxGroupRef.current, progress)",
              'collision fx render update',
          )
          board = replace_once(
              board,
              "playbackCacheRef.current = { id: null, playerPoints: [], actorPoints: new Map() }",
              "if (playbackCacheRef.current.id !== null) clearCollisionDebugFx(collisionFxGroupRef.current)\\n      playbackCacheRef.current = { id: null, playerPoints: [], actorPoints: new Map() }",
              'collision fx no-playback cleanup',
          )
          board = replace_once(
              board,
              "delete host.dataset.playbackId",
              "host.dataset.collisionFxEventCount = '0'\\n      delete host.dataset.playbackId\\n      host.dataset.collisionDebugFx = showDebugCollisionFxRef.current ? 'on' : 'off'\\n      host.dataset.collisionDebugFxStyle = showDebugCollisionFxRef.current ? 'logic-event-pulse-v1' : 'off'",
              'collision fx datasets',
          )
          '''
          if old not in text:
              raise RuntimeError('old strict render block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python scripts/apply-control-window-collision-vfx.py

      - name: Install dependencies
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify patch
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          pnpm verify:dist
          pnpm verify:browser

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/Board3D.jsx src/labs/control-window/ControlWindowLabV3.jsx scripts/verify-control-window-lab.mjs
          git commit -m "Add Control Window collision debug VFX"
          git push origin HEAD:fix/control-window-collision-vfx
