name: Fix UT7 verifier regex

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fix browser verifier regex escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-ut7-basic-move.mjs')
          text = path.read_text()
          old = r"snapshot.playbackMotion.match(/\\b[ML]\\b/g)"
          new = r"snapshot.playbackMotion.match(/\b[ML]\b/g)"
          if new not in text:
              if old not in text:
                  raise SystemExit('UT7 playback regex marker missing')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit verifier correction
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-ut7-basic-move.mjs
          git commit -m 'Fix UT7 browser path verifier regex'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
