name: Cleanup stale prototype branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-stale-prototype-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with write credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete all non-main non-backup branches
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}')
          failures=()
          deleted=0
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|backup|backup/*)
                echo "preserve: ${branch}"
                continue
                ;;
            esac
            echo "delete: ${branch}"
            if git push origin --delete "$branch"; then
              deleted=$((deleted + 1))
            else
              failures+=("$branch")
            fi
          done
          echo "deleted ${deleted} non-main/non-backup branch(es)"
          if (( ${#failures[@]} > 0 )); then
            printf 'failed to delete: %s\n' "${failures[*]}"
            exit 1
          fi
