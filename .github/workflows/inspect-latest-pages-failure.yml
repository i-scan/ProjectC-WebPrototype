name: Inspect latest Pages failure

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect latest main Pages run
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const targetSha = context.payload.pull_request.base.sha
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'deploy-pages.yml',
              branch: 'main',
              per_page: 100,
            })
            const run = runs.find((candidate) => candidate.head_sha === targetSha) ?? runs[0]
            if (!run) {
              core.setFailed('No Deploy GitHub Pages run was found.')
              return
            }

            core.info(`TARGET_SHA=${targetSha}`)
            core.info(`RUN_ID=${run.id}`)
            core.info(`RUN_URL=${run.html_url}`)
            core.info(`RUN_EVENT=${run.event}`)
            core.info(`RUN_STATUS=${run.status}`)
            core.info(`RUN_CONCLUSION=${run.conclusion}`)
            core.info(`RUN_HEAD_SHA=${run.head_sha}`)

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            })

            for (const job of jobs) {
              core.info(`JOB ${job.id} ${job.name}: ${job.status}/${job.conclusion}`)
              for (const step of job.steps ?? []) {
                core.info(`  STEP ${step.number} ${step.name}: ${step.status}/${step.conclusion}`)
              }
              if (!['failure', 'cancelled', 'timed_out'].includes(job.conclusion ?? '')) continue
              try {
                const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {
                  owner,
                  repo,
                  job_id: job.id,
                  request: { redirect: 'follow' },
                })
                const text = typeof response.data === 'string'
                  ? response.data
                  : Buffer.from(response.data).toString('utf8')
                const lines = text.split(/\r?\n/)
                core.info(`--- LOG TAIL ${job.id} ---`)
                core.info(lines.slice(-220).join('\n'))
                core.info(`--- END LOG TAIL ${job.id} ---`)
              } catch (error) {
                core.warning(`Unable to download logs for job ${job.id}: ${error.message}`)
              }
            }

            if (run.conclusion === 'success') {
              core.notice('The latest matching Pages workflow succeeded; inspect other failing workflows separately.')
            }
