name: One-time branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main and backup
        uses: actions/github-script@v7
        with:
          script: |
            const keep = new Set(['main', 'backup/pre-rebuild-2026-08-22'])
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })

            for (const branch of branches) {
              if (keep.has(branch.name)) {
                core.info(`Keep ${branch.name}`)
                continue
              }

              core.info(`Delete ${branch.name}`)
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch.name}`,
              })
            }
