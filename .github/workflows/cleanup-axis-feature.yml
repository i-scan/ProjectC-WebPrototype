name: One-time Axis feature cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-axis-feature.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged Axis feature branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = 'feat/axis-thermal-preview-polish'
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              })
              core.info(`Deleted ${branch}`)
            } catch (error) {
              if (error.status === 422 || error.status === 404) {
                core.info(`${branch} already absent`)
              } else {
                throw error
              }
            }
