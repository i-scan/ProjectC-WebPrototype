name: Apply canonical Trajectory preview routes

on:
  push:
    branches:
      - fix/trajectory-canonical-preview-routes
    paths:
      - .github/workflows/apply-trajectory-v3.yml
      - .tmp/patch-trajectory-v3.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trajectory-canonical-preview-routes
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Trajectory v3 patch
        run: python .tmp/patch-trajectory-v3.py
      - name: Install dependencies
        run: pnpm install
      - name: Verify
        run: pnpm test && pnpm build && pnpm verify:dist && pnpm verify:browser
      - name: Commit implementation only
        shell: bash
        run: |
          rm -f .github/workflows/apply-trajectory-v3.yml .tmp/patch-trajectory-v3.py
          rmdir .tmp 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts .github/workflows/apply-trajectory-v3.yml .tmp/patch-trajectory-v3.py
          git commit -m "Canonicalize Trajectory routes and preview"
          git push origin HEAD:fix/trajectory-canonical-preview-routes
