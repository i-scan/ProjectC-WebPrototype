name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: true

env:
  VITE_BUILD_COMMIT: ${{ github.sha }}
  VITE_BUILD_BRANCH: ${{ github.ref_name }}
  VITE_BUILD_REPOSITORY: ${{ github.repository }}
  VITE_BUILD_RUN_ID: ${{ github.run_id }}
  VITE_BUILD_RUN_NUMBER: ${{ github.run_number }}
  VITE_BUILD_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
  VITE_SITE_BASE_URL: https://i-scan.github.io/ProjectC-WebPrototype/

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main commit
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Record build time
        run: echo "VITE_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Run rules and regression tests
        run: pnpm test

      - name: Build production site
        run: pnpm build

      - name: Verify production artifact
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: pnpm verify:dist

      - name: Verify current browser experiment
        run: pnpm verify:browser

      - name: Upload current browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            ./artifacts/ut7-basic-move.*
          if-no-files-found: warn
          retention-days: 30

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Keep commit-specific build artifact
        uses: actions/upload-artifact@v4
        with:
          name: projectc-pages-${{ github.sha }}
          path: ./dist
          if-no-files-found: error
          retention-days: 30

      - name: Summarize verified build
        run: |
          echo '## ProjectC Pages build' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`main\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Rules, regression tests, TypeScript, Vite build, focused production-bundle checks, and current Impulse Inertia real-Chrome checks: **passed**' >> "$GITHUB_STEP_SUMMARY"
          echo "- Revision check: https://i-scan.github.io/ProjectC-WebPrototype/?revision=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build metadata: https://i-scan.github.io/ProjectC-WebPrototype/build-info.json?revision=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout verifier
        uses: actions/checkout@v4

      - name: Verify published commit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verify-deployment.mjs "$PAGE_URL" "$EXPECTED_COMMIT"

      - name: Publish verified links
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          latest_url="${PAGE_URL%/}/"
          revision_url="${latest_url}?revision=${GITHUB_SHA}"
          metadata_url="${latest_url}build-info.json?revision=${GITHUB_SHA}"
          echo '## Verified production deployment' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Stable latest: ${latest_url}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit check: ${revision_url}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build metadata: ${metadata_url}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
