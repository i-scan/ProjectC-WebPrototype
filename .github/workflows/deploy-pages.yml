name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # These checks remain visible diagnostics, but a regression-test or
      # strict-type failure must not leave the playable prototype stuck on an
      # older Pages artifact. Vite syntax/build failure still blocks deploy.
      - name: Test diagnostics
        id: tests
        continue-on-error: true
        run: npm run test

      - name: TypeScript diagnostics
        id: typecheck
        continue-on-error: true
        run: npx tsc -b --pretty false

      - name: Build playable prototype
        run: npx vite build

      - name: Write build metadata
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
        run: |
          printf '{"commit":"%s","builtAt":"%s","uiRevision":"tc1-inspector-flow-v2","deploymentMode":"prototype-vite","testResult":"%s","typecheckResult":"%s"}\n' \
            "$GITHUB_SHA" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "$TEST_RESULT" \
            "$TYPECHECK_RESULT" \
            > dist/build-info.json

          {
            echo '## ProjectC Pages build'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- UI revision: \`tc1-inspector-flow-v2\`"
            echo "- Vitest / rules diagnostics: **$TEST_RESULT**"
            echo "- TypeScript diagnostics: **$TYPECHECK_RESULT**"
            echo '- Deployment is blocked only when the Vite production build fails.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          entry_url="${PAGE_URL%/}/?commit=${EXPECTED_COMMIT}"
          html=""
          for attempt in {1..18}; do
            if html="$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              "$entry_url")"; then
              break
            fi
            echo "Site is not available yet; retrying ($attempt/18)..."
            sleep 5
          done

          test -n "$html"
          printf '%s' "$html" | grep -q 'projectc-ui-revision'
          printf '%s' "$html" | grep -q 'tc1-inspector-flow-v2'

          if printf '%s' "$html" | grep -q '/src/main.tsx'; then
            echo 'Published page still references the Vite development entry.' >&2
            exit 1
          fi

          script_path="$(printf '%s' "$html" | grep -oE 'src="[^"]+\.js"' | head -n 1 | cut -d '"' -f 2)"
          test -n "$script_path"

          case "$script_path" in
            http://*|https://*) script_url="$script_path" ;;
            /*)
              origin="$(printf '%s' "$PAGE_URL" | sed -E 's#(https?://[^/]+).*#\1#')"
              script_url="${origin}${script_path}"
              ;;
            *) script_url="${PAGE_URL%/}/${script_path}" ;;
          esac

          curl --fail --silent --show-error --location \
            -H 'Cache-Control: no-cache' \
            "${script_url}?commit=${EXPECTED_COMMIT}" \
            --output published-app.js
          grep -q 'thermal-clock-inspector-slot' published-app.js
          grep -q 'Select Test Action' published-app.js
          grep -q '完整 Period 固定分为 4 个等长相位' published-app.js

          build_info_url="${PAGE_URL%/}/build-info.json?commit=${EXPECTED_COMMIT}"
          curl --fail --silent --show-error --location \
            -H 'Cache-Control: no-cache' \
            "$build_info_url" \
            --output published-build-info.json
          grep -q "$EXPECTED_COMMIT" published-build-info.json
          grep -q 'tc1-inspector-flow-v2' published-build-info.json
          grep -q 'prototype-vite' published-build-info.json

          echo "Verified current commit, TC1 inspector flow, bundle, and build metadata: $script_url"
