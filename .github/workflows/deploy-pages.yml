name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-main
  cancel-in-progress: true

env:
  VITE_BUILD_COMMIT: ${{ github.sha }}
  VITE_BUILD_BRANCH: ${{ github.ref_name }}
  VITE_SITE_BASE_URL: https://i-scan.github.io/ProjectC-WebPrototype/

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install prototype dependencies
        run: pnpm install
      - name: Record build time
        run: echo "VITE_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Unit tests
        run: pnpm test
      - name: Build production site
        run: pnpm build
      - name: Verify production artifact
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: pnpm verify:dist
      - name: Verify Axis, Hold, Momentum, and reflection in Chrome
        run: pnpm verify:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stepwise-reflection-hold-evidence-${{ github.sha }}
          path: artifacts/stepwise-reflection-hold.*
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - uses: actions/upload-artifact@v4
        with:
          name: projectc-pages-${{ github.sha }}
          path: ./dist
          retention-days: 30

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Verify published commit
        run: node scripts/verify-deployment.mjs "${{ steps.deployment.outputs.page_url }}" "${{ github.sha }}"

  report:
    if: always() && github.ref == 'refs/heads/main'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Report final Pages verification status
        uses: actions/github-script@v7
        with:
          script: |
            const buildResult = '${{ needs.build.result }}'
            const deployResult = '${{ needs.deploy.result }}'
            const ok = buildResult === 'success' && deployResult === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'pages/verified-deployment',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: ok
                ? 'Actor-body Axis / Hold / stepwise reflection verified online'
                : `Pages verification failed: build=${buildResult}, deploy=${deployResult}`
            })
