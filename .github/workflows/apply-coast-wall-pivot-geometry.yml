name: Apply Coast wall-pivot geometry fix

on:
  push:
    branches:
      - fix/trajectory-coast-wall-pivot-geometry

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trajectory-coast-wall-pivot-geometry
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply geometry patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing anchor in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          rules = 'src/labs/trajectory/trajectory-rules.js'
          replace(rules,
            "import { HEX_DIRECTIONS, axialDistance, axialToWorld, directionIdBetween, directionVector, worldToAxial } from '../../sim/hex.js'",
            "import { HEX_DIRECTIONS, axialDistance, axialToWorld, directionIdBetween, directionVector, worldToAxial, worldToAxialFraction } from '../../sim/hex.js'")
          replace(rules,
            "export function withCoastProjection(controlledPlan, coastPlan) {\n",
            "export function coastProjectionPath(coastPlan) {\n  if (!coastPlan?.valid) return []\n  if ((coastPlan.reflectionCount ?? 0) <= 0) return (coastPlan.pathCells ?? []).map((hex) => ({ ...hex }))\n  return (coastPlan.samples ?? []).map((sample) => worldToAxialFraction(sample.position))\n}\n\nexport function withCoastProjection(controlledPlan, coastPlan) {\n")
          replace(rules,
            "      ...(coastPlan?.valid ? { coastProjection: coastPlan.pathCells } : {}),",
            "      ...(coastPlan?.valid ? { coastProjection: coastProjectionPath(coastPlan) } : {}),")

          lab = 'src/labs/trajectory/TrajectoryLab.jsx'
          replace(lab,
            "  createTrajectoryTargets,\n  makeTrajectoryState,",
            "  coastProjectionPath,\n  createTrajectoryTargets,\n  makeTrajectoryState,")
          replace(lab,
            "    actorTrajectories: { ...(coastPlan.actorTrajectories ?? {}), coastProjection: coastPlan.pathCells ?? [] },",
            "    actorTrajectories: { ...(coastPlan.actorTrajectories ?? {}), coastProjection: coastProjectionPath(coastPlan) },")

          tests = 'src/labs/trajectory/trajectory-rules.test.js'
          replace(tests,
            "  compatibleStartupMove,\n  makeTrajectoryState,",
            "  coastProjectionPath,\n  compatibleStartupMove,\n  makeTrajectoryState,")
          anchor = "  it('preserves the reflected yellow Coast projection as a polyline instead of smoothing through the wall pivot', () => {"
          addition = """  it('puts the actual wall contact point into the reflected yellow Coast geometry', () => {\n    const wall = { id: 'coast-wall', hex: { q: 3, r: 0 }, kind: 'hard', wallAxis: 'NS' }\n    const state = makeTrajectoryState({ axisId: 'E', momentum: 3 })\n    const coast = plan(state, 'skip', null, { obstacles: [wall] })\n    expect(coast.reflectionCount).toBe(1)\n    const collision = coast.collisions[0]\n    const projection = coastProjectionPath(coast)\n    const worldPoints = projection.map((point) => axialToWorld(point))\n    expect(worldPoints.some((point) => Math.hypot(point.x - collision.position.x, point.z - collision.position.z) < 0.0001)).toBe(true)\n  })\n\n"""
          replace(tests, anchor, addition + anchor)
          PY
      - name: Install dependencies
        run: pnpm install
      - name: Verify
        run: |
          pnpm test
          pnpm build
          pnpm verify:dist
          pnpm verify:browser
      - name: Commit implementation only
        shell: bash
        run: |
          rm .github/workflows/apply-coast-wall-pivot-geometry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/labs/trajectory/trajectory-rules.js src/labs/trajectory/trajectory-rules.test.js src/labs/trajectory/TrajectoryLab.jsx .github/workflows/apply-coast-wall-pivot-geometry.yml
          git commit -m "Use resolved Coast samples for reflected yellow preview"
          git push origin HEAD:fix/trajectory-coast-wall-pivot-geometry
