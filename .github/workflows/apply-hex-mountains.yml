name: Apply Hex6 Mountains

on:
  push:
    branches:
      - agent/bootstrap-web-prototype

permissions:
  contents: write

concurrency:
  group: apply-hex-mountains
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-web-prototype
          fetch-depth: 0
      - name: Check trigger
        id: trigger
        run: |
          if [ -f .github/hex-mountains-trigger.txt ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply source patch
        if: steps.trigger.outputs.enabled == 'true'
        run: node scripts/apply-hex-mountains.mjs
      - uses: actions/setup-node@v4
        if: steps.trigger.outputs.enabled == 'true'
        with:
          node-version: 22
      - name: Validate
        if: steps.trigger.outputs.enabled == 'true'
        run: |
          npm install --no-package-lock
          npm run test
          npm run build
      - name: Commit verified patch
        if: steps.trigger.outputs.enabled == 'true'
        run: |
          rm -f package-lock.json tsconfig.app.tsbuildinfo tsconfig.node.tsbuildinfo
          rm .github/hex-mountains-trigger.txt
          rm scripts/apply-hex-mountains.mjs
          rm .github/workflows/apply-hex-mountains.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hex/hexRules.ts src/hex/hexTravel.ts src/hex/HexThreeBoard.tsx src/hex/HexPrototype.tsx .github/hex-mountains-trigger.txt scripts/apply-hex-mountains.mjs .github/workflows/apply-hex-mountains.yml
          git commit -m "Add mountain collision terrain to Hex6 maps"
          git push origin HEAD:agent/bootstrap-web-prototype
