name: Verify refined Trajectory tangent geometry

on:
  push:
    branches:
      - fix/trajectory-smooth-curve-reflection
    paths:
      - .github/workflows/apply-trajectory-v4b.yml
      - .tmp/patch-trajectory-v4b.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trajectory-smooth-curve-reflection
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply refined tangent geometry
        run: python .tmp/patch-trajectory-v4b.py
      - name: Install dependencies
        run: pnpm install
      - name: Verify
        run: pnpm test && pnpm build && pnpm verify:dist && pnpm verify:browser
      - name: Commit implementation only
        shell: bash
        run: |
          rm -f .github/workflows/apply-trajectory-v4b.yml .tmp/patch-trajectory-v4b.py
          rmdir .tmp 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts .github/workflows/apply-trajectory-v4b.yml .tmp/patch-trajectory-v4b.py
          git commit -m "Refine Trajectory tangent curve construction"
          git push origin HEAD:fix/trajectory-smooth-curve-reflection
